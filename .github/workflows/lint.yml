# GitHub Actions workflow for R code linting
# This workflow runs lintr to check code style

name: R-lint

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - bugfix/*
      - release/*
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    name: Lint R code

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          install.packages(c("lintr", "devtools"))
        shell: Rscript {0}

      - name: Run lintr
        run: |
          lintr::lint_dir("R")
        shell: Rscript {0}
